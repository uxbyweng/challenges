{% extends "_baseLayout.html" %}

{% block page_header %}
<header class="masthead" style='background-image: url("/assets/img/post-bg.jpg")'>
    <div class="container position-relative px-4 px-lg-5">
        <div class="row gx-4 gx-lg-5 justify-content-center">
            <div class="col-md-10 col-lg-8 col-xl-7">
                <div class="page-heading">
                    <h1>{{ heading }}</h1>
                    <span class="subheading">Admin</span>
                </div>
            </div>
        </div>
    </div>
</header>
{% endblock page_header %}

{% block main_content %}
<main class="mb-4">
    <div class="container px-4 px-lg-5">
        <div class="row gx-4 gx-lg-5 justify-content-center">
            <div class="col-md-10 col-lg-8 col-xl-7">
                <form method="post" action="{{ action }}">
                    <div class="form-floating mb-3">
                        <input class="form-control" id="title" name="title" type="text" placeholder="Title"
                            value="{{ post.title }}" required />
                        <label for="title">Title</label>
                    </div>

                    <div class="form-floating mb-3">
                        <select class="form-select" id="authorId" name="authorId" required>
                            <option value="">Choose an author</option>
                            {% for author in authors %}
                            <option value="{{ author.id }}" {% if author.id == post.authorId %}selected{% endif %}>{{ author.name }}</option>
                            {% endfor %}
                        </select>
                        <label for="authorId">Author</label>
                    </div>

                    <div class="form-floating mb-3">
                        <input class="form-control" id="image" name="image" type="text" placeholder="Image"
                            value="{{ post.image }}" required />
                        <label for="image">Image URL (z.b. flowers.jpg)</label>
                    </div>

                    <div class="form-floating mb-3">
                        <textarea class="form-control" id="teaser" name="teaser" placeholder="Teaser"
                            style="height: 6rem" required>{{ post.teaser }}</textarea>
                        <label for="teaser">Teaser</label>
                    </div>

                    <div class="form-floating mb-3">
                        <textarea class="form-control" id="content" name="content" placeholder="Content"
                            style="height: 16rem" required>{{ post.content }}</textarea>
                        <label for="content">Content (HTML)</label>
                    </div>

                    <button class="btn btn-primary text-uppercase" type="submit">Save</button>
                    <a class="btn btn-outline-secondary text-uppercase" href="/admin">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</main>
{% endblock main_content %}
